# ttpull and kashibox share ONE archive folder: ttpull creates and updates it, kashibox reads it.
# kashibox needs no viewer files (no Archive.html / app.js). With DB_UPDATE=write an empty folder
# is set up automatically; existing files are never overwritten. See README.md.
services:
  ttpull:
    image: ghcr.io/nullredvector/ttpull:latest
    # build: ./container  # uncomment for local dev
    ports:
      - "3847:3847"
    volumes:
      # The archive folder (videos, covers and the database). Mount the same folder in kashibox.
      - ${ARCHIVE_DIR:-./archive}:/app/archive
      # Browser profile (keeps the login), session and retry state
      - ${STATE_DIR:-./state}:/data
    shm_size: 1gb            # Chromium needs more than Docker's 64MB default
    environment:
      - ARCHIVE_DIR=/app/archive
      # Starting check interval in minutes (default 30; 0 pauses). Change it any time from kashibox's
      # Settings page; a saved value wins over this one.
      - SYNC_INTERVAL_MINUTES=${SYNC_INTERVAL_MINUTES:-}
      # off | dry (log only) | write (update the archive viewer's database)
      - DB_UPDATE=${DB_UPDATE:-dry}
      - TZ=${TZ:-America/New_York}
      # Push notifications (ntfy). Leave NTFY_URL empty to disable.
      - NTFY_URL=${NTFY_URL:-}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      # Daily refresh of the viewer's official lists (videos the site removed). 'off' disables.
      - REFRESH_SCHEDULE=${REFRESH_SCHEDULE:-0 4 * * *}
      - NOTIFY_EVENTS=${NOTIFY_EVENTS:-login,failure,new,catchup,verify,gaveup,db}
      - HEALTHCHECK_URL=${HEALTHCHECK_URL:-}
      # The scout (For You picks): OFF unless SCOUT=on here AND the switch in kashibox's Settings is on.
      # It only looks, never likes anything. SCOUT_DRY=1 logs what it would do and writes nothing.
      - SCOUT=${SCOUT:-off}
      - SCOUT_DRY=${SCOUT_DRY:-}
      - SCORER_URL=${SCORER_URL:-http://autotagtt:8090}
      # Max new videos per list on a scheduled run (POST /sync?full=1 ignores it)
      - MAX_PER_RUN=${MAX_PER_RUN:-60}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    restart: unless-stopped
