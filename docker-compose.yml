services:
  ttpull:
    image: ghcr.io/nullredvector/ttpull:latest
    # build: ./container  # uncomment for local dev
    ports:
      - "3847:3847"
    volumes:
      # Where videos and the viewer's database live (the archive folder)
      - ${ARCHIVE_DIR:-./archive}:/app/archive
      # Browser profile (keeps the login), session and retry state
      - ${STATE_DIR:-./state}:/data
    shm_size: 1gb            # Chromium needs more than Docker's 64MB default
    environment:
      - ARCHIVE_DIR=/app/archive
      - CRON_SCHEDULE=${CRON_SCHEDULE:-*/10 * * * *}
      # off | dry (log only) | write (update the archive viewer's database)
      - DB_UPDATE=${DB_UPDATE:-dry}
      - TZ=${TZ:-America/New_York}
      # Push notifications (ntfy). Leave NTFY_URL empty to disable.
      - NTFY_URL=${NTFY_URL:-}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      - NOTIFY_EVENTS=${NOTIFY_EVENTS:-login,failure,new,catchup,verify,gaveup,db}
      - HEALTHCHECK_URL=${HEALTHCHECK_URL:-}
      # Max new videos per list on a scheduled run (POST /sync?full=1 ignores it)
      - MAX_PER_RUN=${MAX_PER_RUN:-60}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    restart: unless-stopped
