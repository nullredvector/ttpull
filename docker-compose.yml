services:
  ttpull:
    image: ghcr.io/nullredvector/ttpull:latest
    # build: ./container  # uncomment for local dev
    ports:
      - "3847:3847"
    volumes:
      - ${ARCHIVE_DIR:-./archive}:/app/archive
    environment:
      - ARCHIVE_DIR=/app/archive
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 3 * * *}
      # off | dry (log only) | write (update the archive viewer's database)
      - DB_UPDATE=${DB_UPDATE:-dry}
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    command: --interval 300 --cleanup ttpull
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
